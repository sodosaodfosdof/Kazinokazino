<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GAME CLUB</title>

<style>
:root{
  --bg:#080b14;
  --panel:#121a2a;
  --gold:#ffd54a;
  --blue:#3579ff;
  --green:#087044;
}

*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  font-family:Arial,sans-serif;
  color:white;
  text-align:center;
  background:
    radial-gradient(circle at 50% -10%,#273b70 0,#101626 42%,#05070c 100%);
}

header{
  padding:18px 10px;
  background:rgba(5,8,15,.94);
  border-bottom:1px solid #334155;
  position:sticky;
  top:0;
  z-index:10;
}

.logo{
  font-size:clamp(25px,7vw,42px);
  font-weight:900;
  color:var(--gold);
  text-shadow:0 0 20px #c68d00;
}

.stats{
  margin-top:12px;
  display:flex;
  justify-content:center;
  gap:10px;
  flex-wrap:wrap;
}

.stat{
  background:#172033;
  border:1px solid #34445f;
  border-radius:14px;
  padding:9px 15px;
  font-weight:bold;
}

.tabs{
  padding:15px;
  display:flex;
  justify-content:center;
  gap:10px;
  flex-wrap:wrap;
}

button,select,input{
  font:inherit;
}

button{
  border:0;
  border-radius:12px;
  padding:12px 18px;
  color:white;
  font-weight:bold;
  background:linear-gradient(135deg,#397fff,#1748bb);
  cursor:pointer;
  transition:.15s;
}

button:active{transform:scale(.96)}
button:disabled{opacity:.5}

.game{
  display:none;
  max-width:1050px;
  margin:auto;
  padding:10px 14px 35px;
}

.game.active{display:block}

/* ===================== АВТОМАТ ===================== */

.machine{
  max-width:850px;
  margin:auto;
  padding:20px;
  border-radius:35px;
  background:
    linear-gradient(145deg,#4b5e7c,#1a2234 50%,#090e18);
  border:5px solid #8392a9;
  box-shadow:inset 0 0 30px #ffffff10,0 25px 70px #000;
}

.machine-title{
  font-size:clamp(27px,7vw,48px);
  font-weight:900;
  color:var(--gold);
  text-shadow:0 0 18px #bd8200;
  margin-bottom:15px;
}

.settings{
  display:flex;
  justify-content:center;
  gap:10px;
  flex-wrap:wrap;
  margin-bottom:16px;
}

.settings label{
  background:#0c1320;
  padding:8px;
  border-radius:10px;
}

select,input{
  padding:8px;
  border-radius:8px;
  border:0;
  margin-left:5px;
}

.reel-frame{
  padding:14px;
  border-radius:22px;
  background:#020409;
  border:5px solid #77869d;
  box-shadow:inset 0 0 25px #000;
}

.reels{
  display:flex;
  gap:7px;
}

.reel{
  flex:1;
  height:125px;
  overflow:hidden;
  position:relative;
  border-radius:10px;
  background:#f8fafc;
  color:#111;
}

.strip{
  position:absolute;
  width:100%;
  top:0;
}

.symbol{
  height:125px;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:clamp(42px,9vw,70px);
}

.reel:after{
  content:"";
  position:absolute;
  top:50%;
  left:0;
  width:100%;
  height:3px;
  background:#ffd54a;
  box-shadow:0 0 10px #ffd54a;
}

.slot-controls{
  margin-top:17px;
}

.spin{
  margin-top:12px;
  padding:17px 45px;
  font-size:21px;
  background:linear-gradient(135deg,#ffc52e,#b75b00);
  box-shadow:0 0 20px #ffae0040;
}

.message{
  min-height:28px;
  margin-top:14px;
  font-size:18px;
  font-weight:bold;
}

.machine.win{
  animation:flash .35s infinite alternate;
}

@keyframes flash{
  from{box-shadow:0 25px 70px #000,0 0 10px #ffd54a}
  to{box-shadow:0 25px 70px #000,0 0 50px #ffd54a}
}

.particle{
  position:fixed;
  z-index:30;
  pointer-events:none;
  animation:fall 2.5s linear forwards;
}

@keyframes fall{
  from{transform:translateY(-30px) rotate(0deg);opacity:1}
  to{transform:translateY(110vh) rotate(720deg);opacity:0}
}

/* ===================== ДУРАК ===================== */

.durak{
  max-width:950px;
  margin:auto;
  padding:16px;
  border-radius:28px;
  background:linear-gradient(145deg,#09663e,#033321);
  border:5px solid #ba8d38;
  box-shadow:0 20px 55px #000;
}

.info{
  display:flex;
  justify-content:center;
  gap:8px;
  flex-wrap:wrap;
}

.pill{
  padding:8px 12px;
  border-radius:12px;
  background:#0005;
}

.status{
  min-height:45px;
  display:flex;
  align-items:center;
  justify-content:center;
  margin:12px 0;
  padding:8px;
  border-radius:12px;
  background:#0004;
  font-weight:bold;
}

.cards{
  min-height:86px;
  display:flex;
  justify-content:center;
  align-items:flex-end;
  flex-wrap:wrap;
  gap:5px;
}

.card{
  width:56px;
  height:80px;
  border-radius:9px;
  border:2px solid #ddd;
  background:white;
  color:#111;
  display:flex;
  justify-content:center;
  align-items:center;
  font-weight:bold;
  font-size:18px;
  transition:.18s;
}

.red{color:#d51f35}

.playable{
  cursor:pointer;
}

.playable:hover{
  transform:translateY(-12px);
  border-color:#ffd54a;
  box-shadow:0 8px 18px #000;
}

.back{
  background:
    repeating-linear-gradient(
      45deg,
      #1e4fd1 0 7px,
      #102a82 7px 14px
    );
  color:white;
}

.table{
  min-height:160px;
  padding:18px 8px;
  margin:12px 0;
  border-radius:22px;
  background:radial-gradient(circle,#138655,#075337);
  display:flex;
  justify-content:center;
  align-items:center;
  flex-wrap:wrap;
  gap:18px;
}

.pair{
  position:relative;
  width:78px;
  height:105px;
}

.attack{
  position:absolute;
  left:0;
  bottom:0;
}

.defense{
  position:absolute;
  right:0;
  top:0;
  transform:rotate(12deg);
  border-color:#ffd54a;
}

.controls{
  display:flex;
  justify-content:center;
  flex-wrap:wrap;
  gap:8px;
  margin:12px;
}

.take{background:linear-gradient(135deg,#d64a39,#851b16)}
.beat{background:linear-gradient(135deg,#1cac62,#076c38)}

@media(max-width:560px){
  .machine{padding:12px}
  .reel,.symbol{height:92px}
  .card{width:48px;height:68px;font-size:16px}
}
</style>
</head>

<body>

<header>
  <div class="logo">🎮 GAME CLUB</div>
  <div class="stats">
    <div class="stat" id="balance">🪙 Монеты: 1000</div>
    <div class="stat">🎯 Игровые монеты</div>
  </div>
</header>

<div class="tabs">
  <button onclick="showGame('slots')">🎰 АВТОМАТЫ</button>
  <button onclick="showGame('durak')">🃏 ДУРАК</button>
</div>

<section class="game active" id="slots">
  <div class="machine" id="machine">

    <div class="machine-title" id="machineTitle">
      🎰 CLASSIC SLOTS
    </div>

    <div class="settings">
      <label>
        Автомат:
        <select id="machineType" onchange="changeMachine()">
          <option value="classic">🍒 Классический</option>
          <option value="fruit">🍓 Фруктовый</option>
          <option value="diamond">💎 Алмазный</option>
        </select>
      </label>

      <label>
        Барабаны:
        <select id="reelCount" onchange="changeMachine()">
          <option value="3">3 барабана</option>
          <option value="5" selected>5 барабанов</option>
        </select>
      </label>
    </div>

    <div class="reel-frame">
      <div class="reels" id="reels"></div>
    </div>

    <div class="slot-controls">
      <label>
        Ставка:
        <input id="slotBet" type="number" value="20" min="1">
      </label>
      <br>

      <button class="spin" id="spinBtn" onclick="spin()">
        🎰 КРУТИТЬ
      </button>

      <div class="message" id="slotMessage">
        Выбери автомат и запускай барабаны!
      </div>
    </div>

  </div>
</section>

<section class="game" id="durak">
  <div class="durak">

    <h2>🃏 ДУРАК</h2>

    <div class="info">
      <div class="pill">🂠 Колода: <b id="deckCount">0</b></div>
      <div class="pill">👑 Козырь: <b id="trump">?</b></div>
      <div class="pill">🤖 Карт у бота: <b id="botCount">0</b></div>
    </div>

    <h3>🤖 БОТ</h3>
    <div class="cards" id="botCards"></div>

    <div class="status" id="durakStatus">
      Нажми «Новая игра».
    </div>

    <div class="table" id="table"></div>

    <div class="controls">
      <button onclick="newGame()">🔄 Новая игра</button>
      <button class="take" id="takeBtn" onclick="takeCards()" disabled>
        📥 Взять
      </button>
      <button class="beat" id="beatBtn" onclick="finishRound()" disabled>
        ✅ Бито
      </button>
    </div>

    <h3>👤 ТВОИ КАРТЫ</h3>
    <div class="cards" id="playerCards"></div>

  </div>
</section>

<script>
/* ===================== ОБЩЕЕ ===================== */

let balance = Number(localStorage.getItem("gameCoins")) || 1000;

function save(){
  localStorage.setItem("gameCoins",balance);
  document.getElementById("balance").textContent =
    "🪙 Монеты: " + balance;
}

function showGame(id){
  document.querySelectorAll(".game").forEach(game=>{
    game.classList.remove("active");
  });
  document.getElementById(id).classList.add("active");
}

save();

/* ===================== АВТОМАТЫ ===================== */

const machines = {
  classic:{
    name:"🎰 CLASSIC SLOTS",
    icons:["🍒","🍋","🍇","🔔","⭐","7️⃣"]
  },
  fruit:{
    name:"🍓 FRUIT PARTY",
    icons:["🍓","🍒","🍉","🍇","🍊","🍌"]
  },
  diamond:{
    name:"💎 DIAMOND SLOTS",
    icons:["💎","🔷","⭐","👑","💰","7️⃣"]
  }
};

let spinning=false;

function getMachine(){
  return machines[
    document.getElementById("machineType").value
  ];
}

function changeMachine(){
  if(spinning)return;

  const count=Number(
    document.getElementById("reelCount").value
  );

  document.getElementById("machineTitle").textContent =
    getMachine().name;

  const reels=document.getElementById("reels");
  reels.innerHTML="";

  for(let i=0;i<count;i++){
    const reel=document.createElement("div");
    reel.className="reel";
    reel.innerHTML='<div class="strip" id="strip'+i+'"></div>';
    reels.appendChild(reel);

    document.getElementById("strip"+i).innerHTML =
      '<div class="symbol">'+randomIcon()+'</div>';
  }

  slotText("🎰 Выбрано барабанов: "+count);
}

function randomIcon(){
  const icons=getMachine().icons;
  return icons[Math.floor(Math.random()*icons.length)];
}

function buildReel(id,result,extra){
  const strip=document.getElementById("strip"+id);
  const list=[];

  for(let i=0;i<extra;i++){
    list.push(randomIcon());
  }

  list.push(result);

  strip.innerHTML=list.map(icon=>
    '<div class="symbol">'+icon+'</div>'
  ).join("");

  strip.style.transition="none";
  strip.style.transform="translateY(0)";

  return list.length;
}

function spin(){
  if(spinning)return;

  const bet=Math.floor(
    Number(document.getElementById("slotBet").value)
  );

  if(!bet || bet<1){
    slotText("❌ Выбери ставку.");
    return;
  }

  if(bet>balance){
    slotText("❌ Недостаточно монет.");
    return;
  }

  spinning=true;
  balance-=bet;
  save();

  document.getElementById("spinBtn").disabled=true;
  document.getElementById("machineType").disabled=true;
  document.getElementById("reelCount").disabled=true;

  const reelCount=Number(
    document.getElementById("reelCount").value
  );

  slotText("🎰 БАРАБАНЫ КРУТЯТСЯ...");

  const results=[];

  for(let i=0;i<reelCount;i++){
    results.push(randomIcon());
  }

  results.forEach((result,i)=>{
    const amount=buildReel(
      i,result,20+i*5
    );

    const strip=document.getElementById("strip"+i);

    void strip.offsetWidth;

    setTimeout(()=>{
      const height=window.innerWidth<560?92:125;

      strip.style.transition=
        "transform "+(1.7+i*.5)+"s cubic-bezier(.12,.8,.15,1)";

      strip.style.transform=
        "translateY(-"+((amount-1)*height)+"px)";
    },80);
  });

  setTimeout(()=>{
    calculateWin(results,bet);

    spinning=false;
    document.getElementById("spinBtn").disabled=false;
    document.getElementById("machineType").disabled=false;
    document.getElementById("reelCount").disabled=false;

  },3000+reelCount*500);
}

function calculateWin(results,bet){
  const counts={};

  results.forEach(icon=>{
    counts[icon]=(counts[icon]||0)+1;
  });

  const max=Math.max(...Object.values(counts));

  let win=0;
  let message="😔 Не повезло!";

  if(max===results.length){
    win=bet*(results.length===5?20:10);
    message="🔥 СУПЕР КОМБИНАЦИЯ!";
  }
  else if(max>=4){
    win=bet*7;
    message="💥 БОЛЬШОЙ ВЫИГРЫШ!";
  }
  else if(max>=3){
    win=bet*3;
    message="🎉 ВЫИГРЫШ!";
  }
  else if(results.length===3 && max===2){
    win=bet*2;
    message="✨ ПАРА!";
  }

  if(win){
    balance+=win;
    save();
    slotText(message+" +"+win+" 🪙");
    winEffect();
  }else{
    slotText(message);
  }
}

function slotText(text){
  document.getElementById("slotMessage").textContent=text;
}

function winEffect(){
  const machine=document.getElementById("machine");
  machine.classList.add("win");

  for(let i=0;i<30;i++){
    const particle=document.createElement("div");
    particle.className="particle";
    particle.textContent=
      ["✨","🎉","⭐","💰"][
        Math.floor(Math.random()*4)
      ];

    particle.style.left=Math.random()*100+"vw";
    particle.style.fontSize=(18+Math.random()*20)+"px";
    particle.style.animationDelay=Math.random()*.4+"s";

    document.body.appendChild(particle);

    setTimeout(()=>particle.remove(),2800);
  }

  setTimeout(()=>{
    machine.classList.remove("win");
  },2200);
}

changeMachine();

/* ===================== ДУРАК ===================== */

const suits=["♥","♦","♣","♠"];
const ranks=["6","7","8","9","10","В","Д","К","Т"];

let deck=[];
let player=[];
let bot=[];
let trumpSuit="";
let table=[];
let phase="idle";

function shuffle(array){
  for(let i=array.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [array[i],array[j]]=[array[j],array[i]];
  }
}

function newGame(){
  deck=[];

  suits.forEach(suit=>{
    ranks.forEach((rank,value)=>{
      deck.push({suit,rank,value});
    });
  });

  shuffle(deck);

  player=[];
  bot=[];
  table=[];

  trumpSuit=deck[deck.length-1].suit;

  for(let i=0;i<6;i++){
    player.push(deck.pop());
    bot.push(deck.pop());
  }

  phase="playerAttack";

  status("🟢 Твой ход! Выбери карту для атаки.");
  render();
}

function isRed(card){
  return card.suit==="♥" || card.suit==="♦";
}

function cardText(card){
  return card.rank+card.suit;
}

function status(text){
  document.getElementById("durakStatus").textContent=text;
}

function ranksOnTable(){
  const list=[];

  table.forEach(pair=>{
    list.push(pair.attack.rank);
    if(pair.defense)list.push(pair.defense.rank);
  });

  return list;
}

function canBeat(defense,attack){
  if(
    defense.suit===attack.suit &&
    defense.value>attack.value
  )return true;

  if(
    defense.suit===trumpSuit &&
    attack.suit!==trumpSuit
  )return true;

  return false;
}

function render(){
  document.getElementById("deckCount").textContent=deck.length;
  document.getElementById("trump").textContent=trumpSuit;
  document.getElementById("botCount").textContent=bot.length;

  renderBot();
  renderPlayer();
  renderTable();

  document.getElementById("takeBtn").disabled=
    phase!=="playerDefend";

  document.getElementById("beatBtn").disabled=
    !table.length ||
    !table.every(pair=>pair.defense);

  checkEnd();
}

function renderBot(){
  const box=document.getElementById("botCards");
  box.innerHTML="";

  bot.forEach(()=>{
    const card=document.createElement("div");
    card.className="card back";
    card.textContent="🂠";
    box.appendChild(card);
  });
}

function renderPlayer(){
  const box=document.getElementById("playerCards");
  box.innerHTML="";

  player.forEach((card,index)=>{
    const div=document.createElement("div");

    div.className=
      "card "+
      (isRed(card)?"red ":"")+
      (phase!=="idle"?"playable":"");

    div.textContent=cardText(card);

    div.onclick=()=>playerMove(index);

    box.appendChild(div);
  });
}

function renderTable(){
  const box=document.getElementById("table");
  box.innerHTML="";

  table.forEach(pair=>{
    const wrap=document.createElement("div");
    wrap.className="pair";

    const attack=document.createElement("div");
    attack.className=
      "card attack "+
      (isRed(pair.attack)?"red":"");

    attack.textContent=cardText(pair.attack);
    wrap.appendChild(attack);

    if(pair.defense){
      const defense=document.createElement("div");

      defense.className=
        "card defense "+
        (isRed(pair.defense)?"red":"");

      defense.textContent=cardText(pair.defense);
      wrap.appendChild(defense);
    }

    box.appendChild(wrap);
  });
}

function playerMove(index){
  if(phase==="idle")return;

  const card=player[index];

  if(phase==="playerAttack"){
    const allowed=
      !table.length ||
      ranksOnTable().includes(card.rank);

    if(!allowed){
      status("❌ Подкидывать можно только подходящий ранг.");
      return;
    }

    table.push({
      attack:card,
      defense:null
    });

    player.splice(index,1);
    phase="botDefend";

    status("🤖 Бот думает...");
    render();

    setTimeout(botDefend,600);
    return;
  }

  if(phase==="playerDefend"){
    const target=table.find(pair=>!pair.defense);

    if(!target || !canBeat(card,target.attack)){
      status("❌ Эта карта не может побить карту.");
      return;
    }

    target.defense=card;
    player.splice(index,1);

    if(table.every(pair=>pair.defense)){
      status("🛡️ Все карты отбиты! Нажми БИТО.");
    }else{
      status("🛡️ Защити остальные карты.");
    }

    render();
  }
}

function botDefend(){
  const target=table.find(pair=>!pair.defense);

  if(!target)return;

  const options=bot.filter(card=>
    canBeat(card,target.attack)
  );

  if(!options.length){
    table.forEach(pair=>{
      bot.push(pair.attack);
      if(pair.defense)bot.push(pair.defense);
    });

    table=[];
    refill();

    phase="playerAttack";

    status("🤖 Бот взял карты. Ты снова ходишь!");
    render();
    return;
  }

  options.sort((a,b)=>{
    const av=a.value+(a.suit===trumpSuit?30:0);
    const bv=b.value+(b.suit===trumpSuit?30:0);
    return av-bv;
  });

  const defense=options[0];

  target.defense=defense;
  bot.splice(bot.indexOf(defense),1);

  status("🤖 Бот отбился!");
  phase="playerAttack";
  render();
}

function takeCards(){
  if(phase!=="playerDefend")return;

  table.forEach(pair=>{
    player.push(pair.attack);
    if(pair.defense)player.push(pair.defense);
  });

  table=[];
  refill();

  phase="botAttack";

  status("📥 Ты взял карты. Бот ходит.");
  render();

  setTimeout(botAttack,600);
}

function finishRound(){
  if(!table.every(pair=>pair.defense)){
    status("Сначала отбей все карты.");
    return;
  }

  table=[];
  refill();

  phase="botAttack";

  status("✅ БИТО! Бот ходит.");
  render();

  setTimeout(botAttack,600);
}

function botAttack(){
  if(!bot.length){
    checkEnd();
    return;
  }

  bot.sort((a,b)=>{
    const av=a.value+(a.suit===trumpSuit?30:0);
    const bv=b.value+(b.suit===trumpSuit?30:0);
    return av-bv;
  });

  const attack=bot.shift();

  table.push({
    attack,
    defense:null
  });

  phase="playerDefend";

  status(
    "🤖 Бот ходит: "+
    cardText(attack)+
    ". Выбери карту для защиты."
  );

  render();
}

function refill(){
  while(player.length<6 && deck.length){
    player.push(deck.pop());
  }

  while(bot.length<6 && deck.length){
    bot.push(deck.pop());
  }
}

function checkEnd(){
  if(deck.length || table.length)return;

  if(!player.length && !bot.length){
    status("🤝 Ничья!");
    phase="idle";
  }
  else if(!player.length){
    status("🏆 ТЫ ВЫИГРАЛ!");
    phase="idle";
  }
  else if(!bot.length){
    status("🤖 Бот выиграл!");
    phase="idle";
  }
}
</script>
