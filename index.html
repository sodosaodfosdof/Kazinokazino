<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Игровой клуб</title>

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    color: white;
    background: radial-gradient(circle at top, #263b64, #0b1020 65%);
    text-align: center;
}

header {
    padding: 18px;
    background: rgba(10, 15, 30, .85);
    border-bottom: 1px solid #425273;
}

h1 { margin: 0 0 8px; }

#balance {
    display: inline-block;
    padding: 9px 18px;
    background: #1d293f;
    border-radius: 20px;
    font-size: 20px;
    font-weight: bold;
}

.tabs {
    display: flex;
    justify-content: center;
    gap: 10px;
    padding: 15px;
}

button {
    border: 0;
    border-radius: 12px;
    padding: 12px 17px;
    color: white;
    background: #2563eb;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

button:active { transform: scale(.96); }
button:disabled { opacity: .5; }

.game {
    display: none;
    max-width: 900px;
    margin: auto;
    padding: 15px;
}

.game.active { display: block; }

/* ================= АВТОМАТ ================= */

.slot-shell {
    max-width: 600px;
    margin: 15px auto;
    padding: 20px;
    border-radius: 35px;
    background: linear-gradient(145deg, #334155, #111827);
    border: 4px solid #64748b;
    box-shadow: 0 15px 50px rgba(0,0,0,.5);
}

.slot-title {
    font-size: 30px;
    font-weight: bold;
    margin-bottom: 20px;
}

.slot-window {
    display: flex;
    gap: 8px;
    padding: 12px;
    background: #05070c;
    border-radius: 18px;
    border: 4px solid #94a3b8;
}

.reel {
    flex: 1;
    height: 120px;
    overflow: hidden;
    border-radius: 10px;
    background: white;
    color: black;
    position: relative;
}

.symbol {
    height: 120px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 65px;
}

.reel-strip {
    position: absolute;
    width: 100%;
    top: 0;
}

.slot-win {
    animation: winPulse .5s infinite alternate;
}

@keyframes winPulse {
    from { box-shadow: 0 0 10px #fff; }
    to { box-shadow: 0 0 35px #facc15; }
}

.slot-controls {
    margin-top: 18px;
}

input {
    width: 110px;
    padding: 11px;
    border: 0;
    border-radius: 9px;
    font-size: 17px;
    text-align: center;
}

#slotMessage {
    min-height: 25px;
    font-weight: bold;
}

/* ================= ДУРАК ================= */

.durak-board {
    background: linear-gradient(135deg, #075b35, #063b25);
    border: 5px solid #b8903b;
    border-radius: 25px;
    padding: 15px;
}

.info {
    display: flex;
    justify-content: center;
    gap: 15px;
    flex-wrap: wrap;
    margin-bottom: 12px;
}

.cards {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 7px;
    min-height: 78px;
}

.card {
    width: 55px;
    height: 78px;
    background: #f8fafc;
    color: #111;
    border-radius: 8px;
    border: 2px solid #ddd;
    padding: 5px;
    font-size: 19px;
    font-weight: bold;
    cursor: pointer;
    transition: .15s;
}

.card.red { color: #dc2626; }

.card.playable:hover {
    transform: translateY(-12px);
    border-color: #facc15;
    box-shadow: 0 5px 15px rgba(0,0,0,.4);
}

.card.back {
    background: repeating-linear-gradient(
        45deg,
        #1d4ed8,
        #1d4ed8 8px,
        #2563eb 8px,
        #2563eb 16px
    );
    color: white;
}

.table-cards {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 15px;
    min-height: 100px;
    padding: 10px;
}

.pair {
    position: relative;
    width: 75px;
    height: 95px;
}

.pair .attack {
    position: absolute;
    left: 0;
    top: 10px;
}

.pair .defense {
    position: absolute;
    left: 20px;
    top: 0;
    transform: rotate(10deg);
}

.pair .card {
    position: absolute;
}

.controls {
    margin: 15px 0;
    display: flex;
    justify-content: center;
    gap: 8px;
    flex-wrap: wrap;
}

#durakMessage {
    min-height: 45px;
    font-size: 17px;
}

.small { color: #cbd5e1; }

</style>
</head>

<body>

<header>
    <h1>🎮 ИГРОВОЙ КЛУБ</h1>
    <div id="balance">🪙 Монеты: 1000</div>
    <div class="small">Все монеты игровые</div>
</header>

<div class="tabs">
    <button onclick="showGame('slots')">🎰 Автомат</button>
    <button onclick="showGame('durak')">🃏 Дурак</button>
</div>

<!-- ================= АВТОМАТ ================= -->

<section id="slots" class="game active">

<div class="slot-shell">

    <div class="slot-title">🎰 LUCKY SPIN 🎰</div>

    <div class="slot-window">
        <div class="reel"><div class="reel-strip" id="strip0"></div></div>
        <div class="reel"><div class="reel-strip" id="strip1"></div></div>
        <div class="reel"><div class="reel-strip" id="strip2"></div></div>
    </div>

    <div class="slot-controls">
        <p>
            Ставка:
            <input type="number" id="slotBet" value="20" min="1">
        </p>

        <button id="spinBtn" onclick="spin()">КРУТИТЬ 🎰</button>

        <p id="slotMessage">Выбери ставку и крути!</p>
    </div>

</div>

</section
